# EXAMPLE ONLY, untested. Copy to .github/workflows/pages.yml in the repo to build with GitHub Actions
# (needed if you want the site rebuilt every night so past events drop off the list).
# In the repo: Settings > Pages > Source = "GitHub Actions". Action versions may have newer releases.
name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 9 * * *"     # every day at 09:15 UTC
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
