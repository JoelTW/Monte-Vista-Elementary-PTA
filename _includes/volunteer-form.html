{% comment %} COMPONENT: volunteer sign-up form. Set the destination in _data/site.yml > forms > volunteer. {% endcomment %}
<form action="{{ site.data.site.forms.volunteer }}" method="post"><label for="vn">Name</label><input id="vn" name="name" required>
<label for="ve">Email</label><input id="ve" name="email" type="email" required>
<label for="vi">What would you like to help with?</label><select id="vi" name="interest"><option>Events</option><option>Fundraising</option><option>Yearbook</option><option>Teacher Appreciation</option><option>Anything!</option></select>
<label for="vc">Comments</label><textarea id="vc" name="comment"></textarea>
<p><button class="btn btn-blue" type="submit">Sign me up</button></p></form>
