sections:
  - tint: ""
    anchor: ""
    columns:
      - type: text
        heading: Join the PTA
        text: Your membership supports every Monte Vista student. It takes about two minutes.
        buttons:
          - {label: Join the PTA, url: "@join", style: gold}
      - type: card
        title: Scan to join
        image: /assets/qr/join.png
        alt: QR code to join the Monte Vista PTA
        width: 220
  - tint: sky
    anchor: poster
    columns:
      - type: image
        image: /assets/images/join-poster.jpg
        alt: "Join Our PTA poster: Support, connect, make a difference. Fun school events and activities, enrichment programs, school upgrades and the Reflections arts program. Scan the QR code to join today."
        width: 543
        height: 724
        opens_full_size: true
      - type: text
        heading: Share the Join Our PTA poster
        text: "Help more Monte Vista families find us. Print the poster and put it up where families will see it, or share the picture with a friend. The QR code goes straight to our membership page on Totem."
        buttons:
          - {label: Download the print-quality poster, url: /assets/downloads/join-poster-print.jpg, style: gold, download: Monte-Vista-PTA-join-poster.jpg}
          - {label: View it full size, url: /assets/images/join-poster.jpg, style: soft, new_tab: true}
        note: "For printing, use the print-quality file and choose \"fit to page\". It has a sharper QR code."
  - tint: ""
    anchor: volunteer
    columns:
      - type: text
        heading: Volunteer
        text: We're always looking for helping hands. No experience needed!
        form: volunteer
      - type: text
        anchor: yearbook
        heading: Yearbook
        text: "We are collecting photos from school events all year for the Monte Vits yearbook, and we need volunteers to help make it. Send photos or join the team on the Yearbook page."
        buttons:
          - {label: See the Yearbook page, url: /yearbook/, style: gold}
