sections:
  - tint: ''
    anchor: ''
    extra_class: ''
    wrapper: ''
    columns:
      - kind: plain
        anchor: ''
        blocks:
          - type: heading
            text: Join the PTA
            level: 2
          - type: paragraph
            text: Your membership supports every Monte Vista student. It takes about two minutes.
            space_above: false
          - type: buttons
            layout: row
            items:
              - label: Join the PTA
                kind: link
                url: '@join'
                to: ''
                subject: ''
                body: ''
                style: gold
                new_tab: false
                download: ''
      - kind: card
        anchor: ''
        blocks:
          - type: heading
            text: Scan to join
            level: 3
          - type: image
            style: plain
            image: /assets/qr/join.png
            alt: QR code to join the Monte Vista PTA
            opens_full_size: false
            width: 220
            height: null
  - tint: sky
    anchor: poster
    extra_class: ''
    wrapper: ''
    columns:
      - kind: poster
        anchor: ''
        blocks:
          - type: image
            style: poster
            image: /assets/images/join-poster.jpg
            alt: 'Join Our PTA poster: Support, connect, make a difference. Fun school events and activities, enrichment programs, school upgrades and the Reflections arts program. Scan the QR code to join today.'
            opens_full_size: true
            width: 543
            height: 724
  - tint: ''
    anchor: volunteer
    extra_class: ''
    wrapper: ''
    columns:
      - kind: plain
        anchor: ''
        blocks:
          - type: heading
            text: Volunteer
            level: 2
          - type: paragraph
            text: We're always looking for helping hands. No experience needed!
            space_above: false
          - type: form
            form: volunteer
      - kind: plain
        anchor: yearbook
        blocks:
          - type: heading
            text: Yearbook
            level: 2
          - type: paragraph
            text: We are collecting photos from school events all year for the Monte Vits yearbook, and we need volunteers to help make it. Send photos or join the team on the Yearbook page.
            space_above: false
          - type: buttons
            layout: row
            items:
              - label: See the Yearbook page
                kind: link
                url: /yearbook/
                to: ''
                subject: ''
                body: ''
                style: gold
                new_tab: false
                download: ''
