            text: About Monte Vista Parent Teacher Association
            level: 2
          - type: paragraph
            text: 'The Monte Vista Parent Teacher Association (PTA) is a dedicated group of parents, teachers and staff working together to build a strong and connected school community. We organize and support a variety of fun and enriching events throughout the school year, including:'
            space_above: false
          - type: chips
            items:
              - Talent Show
              - Dine Out Nights
              - Campout
              - Movie Nights
              - School Dances
              - Book Fair
              - Fall Festival
              - Site Beautification
              - Teacher Appreciation
          - type: paragraph
            text: From family events to fundraising to volunteer opportunities, the PTA is at the heart of bringing Monte Vista families together.
            space_above: false
