# Pages CMS configuration (https://pagescms.org). Field options follow the Pages CMS docs;
# not yet tested against a real repository, so expect to tweak labels after the first login.
media:
  input: assets/images
  output: /assets/images

content:
  - name: home
    label: Home page text
    type: file
    path: _data/home.yml
    fields:
      - name: hero
        label: Top banner
        type: object
        fields:
          - {name: line1, label: Headline line 1, type: string}
          - {name: line2, label: Headline line 2 (gold), type: string}
          - {name: lead, label: Sentence under the headline, type: text}
          - {name: primary_button, label: Join button text, type: string}
          - {name: secondary_button, label: Events button text, type: string}
          - {name: photo, label: Hero photo (normal rectangular photo), type: image}
          - {name: photo_position, label: Which part to keep in view when cropped (for example center 60%), type: string}
          - {name: photo_alt, label: Photo description (for screen readers), type: string}
      - name: president
        label: President's message
        type: object
        fields:
          - {name: heading, label: Heading, type: string}
          - {name: message, label: Full message, type: text, description: "Blank line between paragraphs; start a line with * for a bullet; put [[photo]] on its own line where the photo should go"}
          - {name: preview_words, label: Words shown before Read more, type: number}
          - {name: tagline, label: Handwritten tagline, type: string}
          - {name: photo, label: Photo, type: image}
          - {name: photo_alt, label: Photo description (for screen readers), type: string}
      - name: cards
        label: Action cards
        type: object
        list: true
        fields:
          - name: color
            label: Colour
            type: select
            options:
              values: [pink, sky, butter, mint]
          - {name: icon, label: Emoji, type: string}
          - {name: title, label: Title, type: string}
          - {name: text, label: Text, type: text}
          - {name: url, label: Link (start with / for pages on this site), type: string}
          - {name: link_text, label: Link text, type: string}
      - name: difference
        label: Your PTA Makes a Difference
        type: object
        fields:
          - {name: heading, label: Heading, type: string}
          - {name: text, label: Sentence, type: text}
          - name: items
            label: Three highlights
            type: object
            list: true
            fields:
              - {name: icon, label: Emoji, type: string}
              - {name: title, label: Title, type: string}
              - {name: text, label: Caption, type: string}
      - name: sponsors
        label: Sponsors
        type: object
        list: true
        fields:
          - {name: name, label: Business name, type: string}
          - {name: url, label: Website, type: string}
          - {name: logo, label: Logo, type: image}

  - name: pages
    label: Page text (Events, Get Involved, Give, Contact)
    type: file
    path: _data/pages.yml
    fields:
      - name: about
        label: About page
        type: object
        fields:
          - {name: heading, label: Heading, type: string}
          - {name: intro, label: Introduction, type: text}
          - {name: events, label: Events we run, type: string, list: true}
          - {name: closing, label: Closing sentence, type: text}
          - {name: team_heading, label: Team section heading, type: string}
          - {name: open_heading, label: Bottom section heading, type: string}
          - {name: open_text, label: Bottom section text, type: text}
      - name: yearbook
        label: Yearbook page
        type: object
        fields:
          - {name: tagline, label: Heading, type: string}
          - {name: intro, label: Introduction, type: text}
          - {name: looking_for, label: Events we want photos from, type: string, list: true}
          - {name: send_heading, label: Send-photos heading, type: string}
          - {name: steps, label: Steps for sending photos, type: string, list: true}
          - {name: tips_heading, label: Tips heading, type: string}
          - {name: tips, label: Photo tips, type: string, list: true}
          - {name: help_heading, label: Volunteer heading, type: string}
          - {name: help_intro, label: Volunteer introduction, type: text}
          - name: roles
            label: Ways to help
            type: object
            list: true
            fields:
              - {name: icon, label: Emoji, type: string}
              - {name: title, label: Title, type: string}
              - {name: text, label: Description, type: text}
              - name: color
                label: Colour
                type: select
                options:
                  values: [pink, sky, butter, mint]
          - {name: join_text, label: Sentence before the email buttons, type: text}
          - {name: order_heading, label: Ordering heading, type: string}
          - {name: order_text, label: Ordering details (price, deadline, how to order). Leave empty to hide., type: text}
      - name: events
        label: Events page
        type: object
        fields:
          - name: banner
            label: Big banner at the top
            type: object
            fields:
              - {name: title_before, label: Headline, type: string}
              - {name: title_highlight, label: Headline words with the gold underline, type: string}
              - {name: title_after, label: Headline ending (such as a question mark), type: string}
              - {name: text, label: Sentence under the headline, type: text}
          - {name: note, label: Note under the list, type: string}
          - {name: volunteer_line, label: Volunteer line (before the link), type: string}
          - {name: volunteer_link_text, label: Volunteer link text, type: string}
          - {name: reflections_heading, label: Reflections heading, type: string}
          - {name: reflections_text, label: Reflections text, type: text}
      - name: give
        label: Give page
        type: object
        fields:
          - {name: donate_text, label: Donate text, type: text}
          - {name: mail_text, label: Mail-a-check text, type: text}
          - {name: spirit_text, label: Spirit Wear text, type: text}
          - {name: sponsor_text, label: Sponsor text, type: text}
      - name: contact
        label: Contact page
        type: object
        fields:
          - {name: board_text, label: Board names, type: text}
          - {name: news_text, label: Newsletter text, type: text}

  - name: event_categories
    label: Event categories (the tag and picture on each event pop-up)
    type: file
    path: _data/event_categories.yml
    fields:
      - name: categories
        label: Categories (an event gets the FIRST one whose words appear in its title, so the order matters)
        type: object
        list: true
        fields:
          - {name: name, label: Name shown on the tag, type: string}
          - {name: slug, label: Picture name (leave as is), type: string}
          - {name: words, label: Words in an event title that put it in this category, type: string, list: true}

  - name: team
    label: Get to know your PTA (board and chairs)
    type: file
    path: _data/team.yml
    fields:
      - {name: intro, label: Sentence under the heading, type: text}
      - name: groups
        label: Groups
        type: object
        list: true
        fields:
          - {name: heading, label: Group heading (for example Executive board), type: string}
          - name: members
            label: People and roles
            type: object
            list: true
            fields:
              - {name: role, label: Role, type: string}
              - {name: name, label: Name (leave empty for "Name coming soon"), type: string}
              - {name: icon, label: Emoji shown when there is no photo, type: string}
              - {name: photo, label: Photo (only with their permission), type: image}
              - {name: blurb, label: What they do, type: text}
              - {name: ask_me_about, label: Ask me about (optional), type: string}
              - {name: email, label: Email (optional), type: string}
              - {name: open, label: Show as an open position, type: boolean}

  - name: site
    label: Site settings (email, address, links)
    type: file
    path: _data/site.yml
    fields:
      - {name: hide_from_search_engines, label: Hide the site from Google and other search engines (turn OFF at launch), type: boolean}
      - {name: draft_banner, label: Draft banner text (clear it to hide), type: string}
      - name: forms
        label: Forms (where messages and sign-ups are sent)
        type: object
        fields:
          - {name: service_name, label: Name of the form service (shown in the privacy note), type: string}
          - {name: endpoint, label: Form address from the service (used by every form), type: string}
          - {name: volunteer, label: Different address for the volunteer form (optional), type: string}
          - {name: contact, label: Different address for the contact form (optional), type: string}
          - {name: newsletter, label: Different address for the newsletter form (optional), type: string}
      - {name: email, label: PTA email, type: string}
      - {name: yearbook_email, label: Yearbook email, type: string}
      - {name: address, label: Address, type: string}
      - {name: president, label: President's name, type: string}
      - name: calendar
        label: Events calendar (where the events come from)
        type: object
        fields:
          - {name: ical_url, label: Public iCal address of the PTA's Google Calendar (leave empty for sample events), type: string}
          - {name: months_ahead, label: How many months ahead to show, type: number}
          - {name: doc_url, label: Link to the yearly calendar Google Doc (clear to hide), type: string}
          - {name: doc_label, label: Text of that link, type: string}
      - name: social
        label: Follow along (Facebook and Instagram)
        type: object
        fields:
          - {name: heading, label: Heading, type: string}
          - {name: intro, label: Sentence under the heading, type: text}
      - name: links
        label: Links
        type: object
        fields:
          - {name: join, label: Join link, type: string}
          - {name: donate, label: Donate link, type: string}
          - {name: spirit, label: Spirit Wear link, type: string}
          - {name: school, label: School website, type: string}
          - {name: facebook, label: Facebook, type: string}
          - {name: instagram, label: Instagram, type: string}
