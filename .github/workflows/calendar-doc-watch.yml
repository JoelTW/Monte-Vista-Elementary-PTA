# Watches the PTA's yearly calendar Google Doc. When it changes, this opens an issue that lists what is new, changed
# or removed and ASSIGNS IT TO THE REPOSITORY OWNER, so GitHub emails them (and sends a phone notification if the
# GitHub mobile app is installed). Closing the issue records the doc as reviewed. See docs/events-and-calendar.md.
#
# UNTESTED on GitHub until it has run once: scheduled and manual runs only work once this file is on the main branch.
# Then: Actions tab > "Watch the calendar doc" > Run workflow. The first run saves a baseline and reports nothing.
# The saved state lives on its own branch, calendar-doc-state, so nothing here ever commits to main.
# GitHub pauses scheduled workflows after 60 days with no activity in the repository. Any new commit wakes it up.
name: Watch the calendar doc

on:
  schedule:
    - cron: "43 */6 * * *"      # every 6 hours, at 43 minutes past
  workflow_dispatch:
  issues:
    types: [closed]             # closing the review issue records the doc as reviewed

permissions:
  contents: write               # to save state on the calendar-doc-state branch
  issues: write                 # to open, update and close the review issue

concurrency:
  group: calendar-doc-watch
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}

jobs:
  watch:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'calendar-doc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Load the saved state
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" calendar-doc-state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch calendar-doc-state "$URL" state
          else
            mkdir state
            git -C state init --quiet -b calendar-doc-state
            git -C state remote add origin "$URL"
          fi

      - name: The issue was closed, so record the doc as reviewed
        if: github.event_name == 'issues'
        run: python scripts/doc_watch.py accept --state state

      - name: Check the doc
        id: check
        if: github.event_name != 'issues'
        run: python scripts/doc_watch.py check --state state --report report.md

      - name: Tell the owner (issue assigned to them)
        if: github.event_name != 'issues'
        run: |
          gh label create calendar-doc --color 0E8A16 --description "The calendar doc changed and needs reviewing" --force >/dev/null
          gh label create calendar-doc-problem --color D93F0B --description "The calendar doc check is failing" --force >/dev/null
          review=$(gh issue list --label calendar-doc --state open --json number --jq '.[0].number // empty')
          problem=$(gh issue list --label calendar-doc-problem --state open --json number --jq '.[0].number // empty')
          status="${{ steps.check.outputs.status }}"

          if [ "$status" = "problem" ]; then
            if [ -z "$problem" ]; then
              gh issue create --label calendar-doc-problem --assignee "$OWNER" \
                --title "The calendar doc check is failing" --body-file report.md
            fi
          elif [ -n "$problem" ]; then
            gh issue close "$problem" --comment "A check worked again, so this is resolved."
          fi

          if [ "$status" = "changed" ]; then
            if [ -z "$review" ]; then
              gh issue create --label calendar-doc --assignee "$OWNER" \
                --title "The calendar doc changed: review the events" --body-file report.md
            elif [ "${{ steps.check.outputs.latest_changed }}" = "true" ]; then
              gh issue edit "$review" --body-file report.md
              gh issue comment "$review" --body "The doc changed again. The lists above are updated."
            fi
          elif [ "$status" = "unchanged" ] && [ -n "$review" ]; then
            gh issue close "$review" --comment "The doc matches the last reviewed version again, so there is nothing to do."
          fi

      - name: Save the state
        if: always()
        run: |
          cd state
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Save calendar doc state"
            git push --quiet origin calendar-doc-state
          fi
